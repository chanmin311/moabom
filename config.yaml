# ─────────────────────────────────────────────
#  모아봄 수집 설정 — 이 파일만 고쳐도 대부분 원하는 대로 바뀌어요
# ─────────────────────────────────────────────

# 요청 사이 대기 시간(초). 사이트에 부담 안 주게 1초 이상 유지하세요.
delay_seconds: 1.5

# 이 단어가 제목/회사명에 있으면 '🎬 콘텐츠' 태그가 붙어요 (사이트에서 따로 모아보기 가능)
content_keywords: [영상, 편집, 콘텐츠, 컨텐츠, 유튜브, 숏폼, 릴스, SNS, 촬영, 디자인, 카드뉴스, 에디터, 크리에이터, 마케팅, PD]

# 이 단어가 들어간 공고는 전부 버려요
exclude_keywords: [다단계, 고수익보장, 텔레마케팅, 국비지원, 교육생]

# ── 사람인 (공식 API, SARAMIN_KEY 필요) ─────────────
saramin:
  enabled: true
  # job_type 코드: 4=인턴직, 11=인턴직(정규직 전환가능), 5=아르바이트, 9=프리랜서
  searches:
    - { type: 인턴, job_type: "4+11", keywords: "" }
    - { type: 인턴, job_type: "4+11", keywords: "콘텐츠" }
    - { type: 알바, job_type: "5+9",  keywords: "영상편집" }
    - { type: 알바, job_type: "5+9",  keywords: "콘텐츠" }
  count: 110          # 한 번에 받을 개수 (최대 110)

# ── 링커리어 ────────────────────────────────────────
linkareer:
  enabled: true
  pages: 2            # 유형별로 몇 페이지 볼지 (1페이지 = 50개)
  # activityTypeID: 1=대외활동, 2=동아리·서포터즈, 3=공모전, 5=채용(인턴만)
  types:
    - { id: "1", type: 대외활동 }
    - { id: "2", type: 서포터즈 }
    - { id: "3", type: 공모전 }
    - { id: "5", type: 인턴, intern_only: true }

# ── 알바몬 / 알바천국 ────────────────────────────────
alba:
  enabled: true
  pages: 2
  max_details: 40
  keywords: [영상, 편집, 콘텐츠, 컨텐츠, 유튜브, 쇼츠, 숏폼, 릴스, 촬영, 디자인, SNS, 에디터, PD, 마케팅, 사무보조]
  sites:
    albamon:
      list_urls:
        - "https://www.albamon.com/jobs/part?parts=C030&page={page}"
        - "https://www.albamon.com/total-search?keyword=콘텐츠&page={page}"
        - "https://www.albamon.com/total-search?keyword=SNS&page={page}"
    alba:
      list_urls:
        - "https://www.alba.co.kr/search/Search?wsSrchWord=영상편집&page={page}"
        - "https://www.alba.co.kr/search/Search?wsSrchWord=콘텐츠&page={page}"
        - "https://www.alba.co.kr/search/Search?wsSrchWord=촬영보조&page={page}"
