name: 공고 수집

on:
  schedule:
    - cron: "47 21,9 * * *"   # 매일 06:47, 18:47 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 브라우저 설치
        run: python -m playwright install --with-deps chromium

      - name: 수집 실행
        env:
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
        run: python -m crawler.main

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "moabom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/posts.json
          git diff --cached --quiet || git commit -m "공고 업데이트 $(TZ=Asia/Seoul date +'%m/%d %H:%M')"
          git push
