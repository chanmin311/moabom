<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아봄 · 대외활동 공고 모음</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b16;--muted:#6f6a5f;--line:#e6e1d6;--accent:#ff5a36}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
  .logo{font-weight:900;font-size:24px;letter-spacing:-.5px}
  .logo span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 16px}
  .warn{background:#fff3ee;border:1px solid #ffd2c4;border-radius:12px;padding:10px 14px;font-size:13px;color:#8a3a22;margin-bottom:14px}
  .search{display:flex;gap:8px;margin-bottom:12px}
  .search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;background:#fff}
  .search select{border:1px solid var(--line);border-radius:12px;padding:0 10px;font:inherit;font-size:14px;background:#fff}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;font-weight:500;color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .meta-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:9px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#f0ede6;color:var(--muted)}
  .tag.new{background:var(--accent);color:#fff}
  .tag.ct{background:#eef3ff;color:#3155b5}
  .tag.st{background:#e9f6ef;color:#1f7a4d}
  .dday{font-size:13px;font-weight:900;white-space:nowrap}
  .dday.hot{color:var(--accent)}
  .title{font-size:16px;font-weight:700;line-height:1.4;margin:0;word-break:keep-all}
  .org{font-size:13px;color:var(--muted)}
  .info{display:flex;flex-wrap:wrap;gap:6px}
  .info span{font-size:12px;background:#faf8f3;border:1px solid var(--line);padding:3px 8px;border-radius:6px}
  .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
  .bottom a{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--accent)}
  .src{font-size:12px;color:var(--muted)}
  .star{background:none;border:0;font-size:20px;cursor:pointer;line-height:1;color:#c9c2b2;padding:0 0 0 8px}
  .star.on{color:#f5a623}
  .reel-btn{width:100%;border:0;border-radius:14px;padding:13px;margin-bottom:14px;font:inherit;font-weight:700;font-size:15px;background:var(--ink);color:#fff;cursor:pointer}
  .reel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;display:none}
  .reel.show{display:block}
  .reel h2{font-size:17px;margin:0 0 4px}
  .reel .desc{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5}
  .reel .ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .reel select{border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:14px;background:#fff}
  .pick{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .pick .no{font-weight:900;font-size:18px;color:var(--accent);width:22px;flex:none}
  .pick .t{font-weight:700;font-size:14px;line-height:1.4}
  .pick .m{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .pick .m b{color:var(--ink)}
  .script{white-space:pre-wrap;background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.6;margin:12px 0 8px}
  .copy{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .prep{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .empty{text-align:center;color:var(--muted);padding:60px 0;grid-column:1/-1}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">모아<span>봄</span></div>
  <p class="sub" id="updated">불러오는 중…</p>
  <div id="warn"></div>

  <button class="reel-btn" id="reelBtn">🎥 이번 주 릴스 소재 뽑기</button>
  <section class="reel" id="reel">
    <h2>이번 주 릴스 소재</h2>
    <p class="desc">릴스를 올리는 날 기준으로, 보는 사람이 <b>지금 준비를 시작해야 제때 지원할 수 있는</b> 공고만 골랐어요. 너무 촉박한 건 빼고, 아직 여유가 많은 건 다음 주로 미뤄요.</p>
    <div class="ctrl">
      <select id="rDay">
        <option value="0">오늘 게시</option><option value="1" selected>내일 게시</option>
        <option value="2">모레 게시</option><option value="3">3일 뒤 게시</option>
      </select>
      <select id="rTheme">
        <option value="all">전체</option><option value="content">🎬 콘텐츠 관련</option><option value="student">🎓 재학생 가능</option>
      </select>
      <select id="rN"><option>3</option><option selected>5</option><option>7</option></select>
    </div>
    <div id="rList"></div>
    <div class="script" id="rScript"></div>
    <button class="copy" id="rCopy">대본 복사</button>
    <div class="prep" id="rPrep"></div>
  </section>

  <div class="search">
    <input id="q" type="search" placeholder="회사명, 직무, 키워드 검색">
    <select id="sort">
      <option value="deadline">마감임박순</option>
      <option value="new">새로 올라온 순</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="meta-row">
    <span id="count"></span>
    <span id="srcFilter"></span>
  </div>
  <div class="grid" id="list"></div>
</div>

<script>
const TYPES = ['인턴','알바','대외활동','서포터즈','공모전'];
const store = {
  get(k,f){ try{ return JSON.parse(localStorage.getItem(k)) ?? f; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let stars = new Set(store.get('moa_stars',[]));
let state = {chip: store.get('moa_chip','전체'), q:'', sort:'deadline'};
let POSTS = [];

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);

function renderChips(){
  const all=['전체','🆕 새 공고','🎬 콘텐츠','🎓 재학생 가능','⭐ 관심',...TYPES];
  $('#chips').innerHTML = all.map(c=>`<button class="chip ${state.chip===c?'on':''}" data-c="${c}">${c}</button>`).join('');
}

function render(){
  const t=todayStr(), q=state.q.trim().toLowerCase();
  let posts = POSTS.filter(p=>{
    if(p.deadline && p.deadline < t) return false;
    const c=state.chip;
    if(c==='🆕 새 공고' && daysBetween(p.first_seen,t)>1) return false;
    if(c==='🎬 콘텐츠' && !p.content) return false;
    if(c==='🎓 재학생 가능' && !p.student) return false;
    if(c==='⭐ 관심' && !stars.has(p.id)) return false;
    if(TYPES.includes(c) && p.type!==c) return false;
    if(q && !(p.title+' '+p.org+' '+p.location+' '+p.type).toLowerCase().includes(q)) return false;
    return true;
  });
  posts.sort((a,b)=> state.sort==='new'
    ? (b.first_seen||'').localeCompare(a.first_seen||'')
    : (!a.deadline)-(!b.deadline) || (a.deadline||'').localeCompare(b.deadline||''));

  $('#count').textContent = `공고 ${posts.length}개`;
  $('#list').innerHTML = posts.length ? posts.map(p=>{
    const d = p.deadline ? daysBetween(t,p.deadline) : null;
    const label = d===null ? '상시' : d===0 ? 'D-DAY' : `D-${d}`;
    const isNew = daysBetween(p.first_seen,t) <= 1;
    return `<article class="card">
      <div class="top">
        <div class="tags">
          ${isNew?'<span class="tag new">NEW</span>':''}
          <span class="tag">${esc(p.type)}</span>
          ${p.content?'<span class="tag ct">콘텐츠</span>':''}
          ${p.student?'<span class="tag st">재학생 OK</span>':''}
        </div>
        <span class="dday ${d!==null&&d<=3?'hot':''}">${label}</span>
      </div>
      <h3 class="title">${esc(p.title)}</h3>
      <div class="org">${esc(p.org)}${p.deadline?` · ~${p.deadline.slice(5).replace('-','/')}`:''}</div>
      ${(p.location||p.pay)?`<div class="info">${p.location?`<span>📍 ${esc(p.location)}</span>`:''}${p.pay?`<span>💰 ${esc(p.pay)}</span>`:''}</div>`:''}
      <div class="bottom">
        <a href="${esc(p.url)}" target="_blank" rel="noopener">공고 보기 →</a>
        <span><span class="src">${esc(p.source)}</span><button class="star ${stars.has(p.id)?'on':''}" data-star="${esc(p.id)}" aria-label="관심 공고">★</button></span>
      </div>
    </article>`;
  }).join('') : `<div class="empty">조건에 맞는 공고가 없어요</div>`;
}

$('#chips').onclick=e=>{const c=e.target.dataset.c; if(!c)return; state.chip=c; store.set('moa_chip',c); renderChips(); render();};
$('#q').oninput=e=>{state.q=e.target.value; render();};
$('#sort').onchange=e=>{state.sort=e.target.value; render();};
$('#list').onclick=e=>{
  const s=e.target.dataset.star; if(!s) return;
  stars.has(s)?stars.delete(s):stars.add(s); store.set('moa_stars',[...stars]); render();
};

// ───────── 릴스 소재 뽑기 ─────────
// 유형별 '지원 준비에 필요한 기간(일)'. 마음대로 바꿔도 돼요.
const PREP = {'알바':2, '서포터즈':5, '대외활동':5, '인턴':7, '공모전':14};
const PREP_WHY = {'알바':'간단 지원서', '서포터즈':'자소서·SNS 계정 정리', '대외활동':'자소서', '인턴':'자소서·포트폴리오', '공모전':'작품 제작'};
const WINDOW = 7;   // 게시일부터 7일 안에 '준비를 시작해야 하는' 공고만
const addDays = (d,n) => { const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); const y=new Date(x); y.setMinutes(y.getMinutes()-y.getTimezoneOffset()); return y.toISOString().slice(0,10); };
const md = d => `${+d.slice(5,7)}/${+d.slice(8,10)}`;
const shortTitle = t => { t=t.replace(/\[[^\]]*\]|\([^)]*\)/g,' ').replace(/\s+/g,' ').trim(); return t.length>30 ? t.slice(0,29)+'…' : t; };

function pickReel(){
  const postDate = addDays(todayStr(), +$('#rDay').value);
  const theme = $('#rTheme').value, n = +$('#rN').value;
  const okTheme = p => theme==='all' || (theme==='content' && p.content) || (theme==='student' && p.student);
  const cands = [];
  for(const p of POSTS){
    if(!okTheme(p)) continue;
    const prep = PREP[p.type] ?? 5;
    if(p.deadline){
      const left = daysBetween(postDate, p.deadline);
      if(left < prep) continue;                       // 보는 사람이 준비할 시간이 부족
      const slack = left - prep;                      // 준비 시작까지 남은 여유
      if(slack > WINDOW) continue;                    // 아직 여유 많음 → 다음 주 소재
      const score = (WINDOW - slack) + (p.content?3:0) + (p.student?2:0) + (daysBetween(p.first_seen,todayStr())<=3?1:0);
      cands.push({p, prep, left, startBy: addDays(p.deadline,-prep), score});
    }
  }
  cands.sort((a,b)=>b.score-a.score);
  // 유형이 한쪽으로 쏠리지 않게: 유형당 최대 2개, 같은 회사 중복 X
  const picked=[], perType={}, orgs=new Set();
  for(const c of cands){
    if(picked.length>=n) break;
    if((perType[c.p.type]||0)>=2 || orgs.has(c.p.org)) continue;
    picked.push(c); perType[c.p.type]=(perType[c.p.type]||0)+1; orgs.add(c.p.org);
  }
  // 모자라면 상시모집 알바로 채우기
  for(const p of POSTS){
    if(picked.length>=n) break;
    if(p.deadline || p.type!=='알바' || !okTheme(p) || orgs.has(p.org)) continue;
    picked.push({p, prep:PREP['알바'], left:null, startBy:null, score:0}); orgs.add(p.org);
  }
  picked.sort((a,b)=>(a.startBy||'9')<(b.startBy||'9')?-1:1);   // 준비 시작이 급한 순
  return {picked, postDate, theme};
}

function renderReel(){
  const {picked, postDate, theme} = pickReel();
  if(!picked.length){
    $('#rList').innerHTML='<p class="desc">조건에 맞는 공고가 없어요. 테마나 게시일을 바꿔보세요.</p>';
    $('#rScript').textContent=''; $('#rPrep').textContent=''; return;
  }
  $('#rList').innerHTML = picked.map((c,i)=>`<div class="pick"><div class="no">${i+1}</div><div>
    <div class="t">${esc(c.p.org)} · ${esc(shortTitle(c.p.title))}</div>
    <div class="m">${esc(c.p.type)} · ${c.left===null?'상시모집':`${md(c.p.deadline)} 마감 (게시일 기준 D-${c.left})`}<br>
    준비 ${c.prep}일(${PREP_WHY[c.p.type]||'지원서'}) → ${c.startBy?`<b>${md(c.startBy)}까지 준비 시작</b>`:'바로 지원 가능'}
    · <a href="${esc(c.p.url)}" target="_blank" rel="noopener">원문</a></div></div></div>`).join('');

  const label = {all:'', content:'콘텐츠 ', student:'재학생 가능 '}[theme];
  const tags = new Set(['#대학생', '#대외활동추천']);
  picked.forEach(c=>tags.add({'알바':'#대학생알바','서포터즈':'#서포터즈','대외활동':'#대외활동','인턴':'#대학생인턴','공모전':'#공모전'}[c.p.type]||''));
  if(theme==='content') tags.add('#영상편집알바');
  const lines = [
    `[훅 0~2초] 이번 주 안에 준비 시작 안 하면 놓치는 ${label}공고 ${picked.length}개`,
    '',
    ...picked.map((c,i)=>`${i+1}. ${c.p.org} ${shortTitle(c.p.title)}\n   → ${c.left===null?'상시모집, 바로 지원 가능':`${md(c.p.deadline)} 마감 · ${c.startBy?md(c.startBy):''}까지 준비 시작 (${PREP_WHY[c.p.type]||'지원서'} ${c.prep}일)`}`),
    '',
    '[마무리] 저장해두고 하나씩 챙기세요. 원문 링크는 프로필에!',
    '',
    [...tags].filter(Boolean).join(' ')
  ];
  $('#rScript').textContent = lines.join('\n');
  $('#rPrep').textContent = `게시일 ${md(postDate)} 기준 · 준비기간: ` + Object.entries(PREP).map(([k,v])=>`${k} ${v}일`).join(', ');
}

$('#reelBtn').onclick=()=>{ const r=$('#reel'); r.classList.toggle('show'); if(r.classList.contains('show')){ renderReel(); r.scrollIntoView({behavior:'smooth'}); } };
['#rDay','#rTheme','#rN'].forEach(id=>$(id).onchange=renderReel);
$('#rCopy').onclick=async()=>{
  try{ await navigator.clipboard.writeText($('#rScript').textContent); $('#rCopy').textContent='복사됨 ✓'; }
  catch(e){ $('#rCopy').textContent='길게 눌러 직접 복사해주세요'; }
  setTimeout(()=>$('#rCopy').textContent='대본 복사',1500);
};

fetch('posts.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
  POSTS = data.posts||[];
  const u = data.updated_at ? new Date(data.updated_at) : null;
  $('#updated').textContent = u ? `마지막 업데이트 ${u.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}` : '';
  const bad = Object.entries(data.sources||{}).filter(([,s])=>!s.ok);
  if(bad.length) $('#warn').innerHTML = `<div class="warn">⚠ 이번 수집에서 실패: ${bad.map(([n,s])=>`<b>${esc(n)}</b> (${esc(s.error)})`).join(', ')}<br>실패한 곳은 지난번 공고를 그대로 보여주고 있어요.</div>`;
  renderChips(); render();
}).catch(()=>{ $('#updated').textContent='posts.json을 못 읽었어요. 크롤러를 한 번 실행해주세요.'; });
</script>
</body>
</html>
